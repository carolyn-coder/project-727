<!doctype html><meta charset="utf-8"><title>button check</title>
<style>
:root{color-scheme:light;
--bg:#f5f6f8;--card:#ffffff;--ink:#17223b;--muted:#6b7488;--line:#e7e9ef;
--teal:#1e6fb5;--teal2:#7cb0dd;--navy:#1f3a5f;--amber:#d98324;--red:#c0392b;--green:#2f6fb0;--chip:#eef2f5;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);margin:0;padding:26px;color:var(--ink)}
.ctrlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.ctrlor{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.winbtn{padding:6px 12px;border:1px solid #d3dae4;background:#fff;border-radius:8px;font:inherit;font-size:13px;color:var(--navy);cursor:pointer}
.winbtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
/* The launch-summary button. Deliberately loud: it is the one control people forget exists. */
.lsumBtn{
  position:relative; overflow:hidden;
  padding:7px 15px 7px 12px;
  border:none; border-radius:999px;
  background:linear-gradient(100deg,var(--teal) 0%,#2b86d4 45%,var(--navy) 100%);
  color:#fff !important; font-weight:700; font-size:12.5px; letter-spacing:.2px;
  cursor:pointer; white-space:nowrap;
  box-shadow:0 2px 8px rgba(30,111,181,.38), 0 0 0 0 rgba(30,111,181,.45);
  animation:lsumPulse 3.4s ease-in-out infinite;
  transition:transform .12s ease, box-shadow .18s ease;
}
.lsumBtn::after{                 /* slow shimmer sweep */
  content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg); animation:lsumShine 3.4s ease-in-out infinite;
}
.lsumBtn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 5px 16px rgba(30,111,181,.5);animation-play-state:paused}
.lsumBtn:hover::after{animation-play-state:paused}
.lsumBtn:active{transform:translateY(0) scale(.99)}
.lsumBtn svg{opacity:.95}
@keyframes lsumPulse{
  0%,100%{box-shadow:0 2px 8px rgba(30,111,181,.38), 0 0 0 0 rgba(30,111,181,.45)}
  50%    {box-shadow:0 2px 10px rgba(30,111,181,.45), 0 0 0 7px rgba(30,111,181,0)}
}
@keyframes lsumShine{0%{left:-60%}55%,100%{left:130%}}
@media(prefers-reduced-motion:reduce){
  .lsumBtn{animation:none} .lsumBtn::after{animation:none;display:none}
}
</style>
<h4>As it sits in the launch card size row</h4>
<div class="ctrlrow">
  <span class="ctrlor">Size</span>
  <button class="winbtn active">All sizes</button><button class="winbtn">S</button><button class="winbtn">M</button>
  <button class="winbtn">L</button><button class="winbtn">XL</button><button class="winbtn">M-Wide</button>
  <button class="winbtn">L-Wide</button><button class="winbtn">XL-Wide</button>
  <button type="button" class="lsumBtn" style="margin-left:auto;display:inline-flex;align-items:center;gap:7px">
    <span style="font-size:13px;line-height:1">&#10024;</span><span>Launch summary</span>
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-7a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/></svg>
  </button>
</div>
<h4>On its own</h4>
<div class="ctrlrow" style="justify-content:flex-start">
  <button type="button" class="lsumBtn" style="display:inline-flex;align-items:center;gap:7px">
    <span style="font-size:13px;line-height:1">&#10024;</span><span>Launch summary</span>
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-7a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1"/></svg>
  </button>
</div>
